<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Energy Dashboard</title>
    <link rel= "stylesheet" href="./style.css"> 
   <script src="./plotly-2.35.2.min.js"></script>
</head>
<body>
    <script src="./plot.js" defer></script>
    
    <h1> Total Electricity Consumption in Germany </h1>  

    <div id="plot" class="chart" style="width:30%; height: 500px;"></div>
   

    <!-- buttons for start and end date -->
    <label for="start_date">Start: </label>
    <input type="date" id="start_date"> 
    <label for="end_date">End:</label>
    <input type="date" id="end_date">

   <p>Total electricity consumption data provided by <a href="https://www.smard.de">SMARD</a>.</p>

    <h1> Average Yearly Electricity Consumption in Germany </h1>

    <div id="avg_yearly_plot" class="chart" style="width: 30%; height: 500px;"></div>

</body>
</html>
