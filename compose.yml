services:
  raw_db_serv:
    build:
      context: .
      dockerfile: dockerfile_raw_db
    container_name: raw_db_con
    ports:
      - "5433:5432"
    networks:
      - ed_network
    volumes:
      - ed_raw_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: pg_isready -U user -d raw_db


  airflow_db_serv:
    image: postgres:17
    networks:
      - ed_network
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=airflow
    healthcheck:
      test: pg_isready -U airflow -d airflow

  airflow_init_serv:
    image: apache/airflow:2.9.3
    depends_on:
      - raw_db_serv
      - airflow_db_serv
    networks:
      - ed_network
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:secret@airflow_db_serv/airflow
    command: >
      bash -c "airflow db init &&
               airflow users create --username airflow --password secret --firstname John --lastname Doe --role Admin --email admin@example.com"

  airflow_webserver:
    build:
      context: .
      dockerfile: dockerfile_airflow
    user: root
    depends_on:
      airflow_init_serv:
        condition: service_completed_successfully
    networks:
      - ed_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src/airflow/dags:/opt/airflow/dags
      - ./src/loading:/opt/airflow/loading
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LOAD_EX=n
      - EXECUTOR=Local
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:secret@airflow_db_serv/airflow
      - AIRFLOW_CONN_DESTINATION_POSTGRES=postgres://user:secret@raw_db_serv:5432/raw_db
      - AIRFLOW__CORE__FERNET_KEY=58nUcS7V9h-FPsbjeRqQV7Dzj416uaBANEuF10thTnU=
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Europe/Berlin
      - AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE=Europe/Berlin
      - AIRFLOW__WEBSERVER__DEFAULT_USER_USERNAME=airflow
      - AIRFLOW__WEBSERVER__DEFAULT_USER_PASSWORD=secret
      - AIRFLOW_WWW_USER_USERNAME=airflow
      - AIRFLOW_WWW_USER_PASSWORD=secret
      - AIRFLOW__WEBSERVER__SECRET_KEY=secret
    ports:
      - "8080:8080"
    command: webserver

  airflow_scheduler:
    build:
      context: .
      dockerfile: dockerfile_airflow
    user: root
    depends_on:
      airflow_init_serv:
        condition: service_completed_successfully
    networks:
      - ed_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src/airflow/dags:/opt/airflow/dags
      - ./src/loading:/opt/airflow/loading
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LOAD_EX=n
      - EXECUTOR=Local
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:secret@airflow_db_serv/airflow
      - AIRFLOW_CONN_DESTINATION_POSTGRES=postgres://user:secret@raw_db_serv:5432/raw_db
      - AIRFLOW__CORE__FERNET_KEY=58nUcS7V9h-FPsbjeRqQV7Dzj416uaBANEuF10thTnU=
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Europe/Berlin
      - AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE=Europe/Berlin
      - AIRFLOW_WWW_USER_USERNAME=airflow
      - AIRFLOW__WEBSERVER__SECRET_KEY=secret
      - AIRFLOW_WWW_USER_PASSWORD=secret
    command: scheduler

networks:
  ed_network:
    driver: bridge

volumes:
  ed_raw_data: